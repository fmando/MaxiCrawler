[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "maxicrawler"
version = "0.1.0"
description = "A modular, extensible foundation for responsible web crawling."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "MaxiCrawler contributors" }]
keywords = ["crawler", "scraping", "automation", "plugins"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.13", "pre-commit>=4.0", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/fmando/MaxiCrawler"
Repository = "https://github.com/fmando/MaxiCrawler"
Issues = "https://github.com/fmando/MaxiCrawler/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/maxicrawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["maxicrawler"]
warn_unused_configs = true
