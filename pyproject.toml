[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "maxicrawler"
version = "0.1.0"
description = "A modular, extensible foundation for responsible web crawling."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "MaxiCrawler contributors" }]
keywords = ["crawler", "scraping", "automation", "plugins"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["protego>=0.5", "rich>=13.7", "typer>=0.15"]

[project.scripts]
maxicrawler = "maxicrawler.cli:app"

[project.entry-points."maxicrawler.plugins"]

[project.optional-dependencies]
mega = ["cryptography>=43"]
brotli = ["brotli>=1.1"]
thumbnails = ["pillow>=11"]
web = [
  "jinja2>=3.1",
  "starlette>=1.0",
  "uvicorn>=0.32",
]
dev = [
  "brotli>=1.1",
  "cryptography>=43",
  "httpx2>=2.10",
  "jinja2>=3.1",
  "mypy>=1.13",
  "pillow>=11",
  "pre-commit>=4.0",
  "protego>=0.5",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "starlette>=1.0",
  "uvicorn>=0.32",
]

[project.urls]
Homepage = "https://github.com/fmando/MaxiCrawler"
Repository = "https://github.com/fmando/MaxiCrawler"
Issues = "https://github.com/fmando/MaxiCrawler/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/maxicrawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["maxicrawler"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["brotli", "brotlicffi"]
ignore_missing_imports = true
