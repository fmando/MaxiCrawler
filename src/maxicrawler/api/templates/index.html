{% extends "base.html" %}
{% block title %}Dashboard · MaxiCrawler{% endblock %}

{% block content %}
<section class="panel">
  <h2>Start a crawl</h2>
  <div class="body">
    {% include "_start_form.html" %}
  </div>
</section>

<section class="panel">
  <h2>Recent crawls</h2>
  {% if crawls %}
    {% include "_crawl_table.html" %}
  {% else %}
    <p class="empty">No crawls recorded yet. Start one above.</p>
  {% endif %}
</section>
{% endblock %}
